        let currentBrand = 'esthe';
        let newCustomersChart = null;
        let secondChart = null;

        function getCurrentData() { return currentBrand === 'esthe' ? estheData : seitaiData; }

        function updateTheme() {
            if (currentBrand === 'seitai') document.documentElement.classList.add('theme-seitai');
            else document.documentElement.classList.remove('theme-seitai');
        }

        function updateSummary() {
            const data = getCurrentData();
            document.getElementById('summaryGrid').innerHTML = `
                <div class="summary-card primary fade-in"><div class="summary-label">全店舗 新規総数</div><div class="summary-value">${data.summary.totalNew}</div><div class="summary-change positive"><span>↑</span> ${data.summary.totalNewChange}</div></div>
                <div class="summary-card secondary fade-in"><div class="summary-label">月平均 新規数</div><div class="summary-value">${data.summary.avgNew}</div><div class="summary-change positive"><span>↑</span> ${data.summary.avgNewChange}</div></div>
                <div class="summary-card success fade-in"><div class="summary-label">最高新規数（月）</div><div class="summary-value">${data.summary.maxNew}</div><div class="summary-change positive">${data.summary.maxNewStore}</div></div>
                <div class="summary-card warning fade-in"><div class="summary-label">平均サロンPV</div><div class="summary-value">${data.summary.avgSalonPV}</div><div class="summary-change positive"><span>↑</span> ${data.summary.avgSalonPVChange}</div></div>
                <div class="summary-card danger fade-in"><div class="summary-label">平均エリアPV</div><div class="summary-value">${data.summary.avgAreaPV}</div><div class="summary-change negative">${data.summary.avgAreaPVChange}</div></div>
            `;
        }

        function updateBrandBadge() { document.getElementById('brandBadge').textContent = getCurrentData().brandName; }

        function updateStoreTabs() {
            const data = getCurrentData();
            let html = `<button class="store-tab active" data-store="all">全店舗</button>`;
            data.stores.forEach(s => html += `<button class="store-tab" data-store="${s.key}">${s.name}</button>`);
            document.getElementById('storeTabs').innerHTML = html;
            document.querySelectorAll('.store-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.store-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    filterTable(tab.dataset.store);
                });
            });
        }

        function updateStoreGrid() {
            const data = getCurrentData();
            let html = '';
            data.stores.forEach(s => {
                html += `<div class="store-card fade-in"><div class="store-card-header"><span class="store-name">${s.name}</span><span class="store-badge ${s.badge}">${s.region}</span></div><div class="store-metrics"><div class="metric"><div class="metric-value" style="color: ${s.color};">${s.avgNew}</div><div class="metric-label">新規数/月</div></div><div class="metric"><div class="metric-value">${s.avgSalonPV.toLocaleString()}</div><div class="metric-label">サロンPV</div></div><div class="metric"><div class="metric-value">${s.avgAreaPV.toLocaleString()}</div><div class="metric-label">平均PV</div></div></div></div>`;
            });
            document.getElementById('storeGrid').innerHTML = html;
        }

        function updateTable() {
            const data = getCurrentData();
            let html = '';
            data.rawData.forEach(row => {
                const pvDiff = row.salonPV - row.avgPV;
                const trendClass = pvDiff >= 0 ? 'trend-up' : 'trend-down';
                const trendIcon = pvDiff >= 0 ? '↑' : '↓';
                const store = data.stores.find(s => s.key === row.key);
                html += `<tr data-store="${row.key}"><td><span class="store-badge ${store ? store.badge : ''}">${row.store}</span></td><td>${row.date}</td><td><strong>${row.newCustomers}</strong></td><td>${row.salonPV.toLocaleString()}</td><td>${row.avgPV.toLocaleString()}</td><td><span class="trend-indicator ${trendClass}">${trendIcon} ${Math.abs(pvDiff).toLocaleString()}</span></td></tr>`;
            });
            document.getElementById('dataTableBody').innerHTML = html;
        }

        function filterTable(storeKey) {
            document.querySelectorAll('#dataTableBody tr').forEach(row => {
                row.style.display = storeKey === 'all' || row.dataset.store === storeKey ? '' : 'none';
            });
        }

        function updateCharts() {
            const data = getCurrentData();
            if (newCustomersChart) newCustomersChart.destroy();
            if (secondChart) secondChart.destroy();
            let legendHtml = '';
            data.chartData.datasets.forEach(ds => legendHtml += `<span class="legend-item"><span class="legend-dot" style="background: ${ds.color};"></span>${ds.label}</span>`);
            document.getElementById('chartLegend').innerHTML = legendHtml;
            const ctx1 = document.getElementById('newCustomersChart').getContext('2d');
            newCustomersChart = new Chart(ctx1, {
                type: 'line',
                data: { labels: data.chartData.labels, datasets: data.chartData.datasets.map(ds => ({ label: ds.label, data: ds.data, borderColor: ds.color, backgroundColor: ds.color + '1a', tension: 0.4, fill: false, pointRadius: 4, pointHoverRadius: 6 })) },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: currentBrand === 'seitai' ? '#1e3b1e' : '#1e293b', titleColor: '#f8fafc', bodyColor: '#94a3b8', borderWidth: 1, padding: 12, cornerRadius: 8 } }, scales: { x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#64748b' } }, y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#64748b' }, beginAtZero: true } } }
            });
            const ctx2 = document.getElementById('secondChart').getContext('2d');
            const secondChartTitle = document.getElementById('secondChartTitle');
            if (currentBrand === 'esthe') {
                secondChartTitle.textContent = 'サロンPV推移';
                secondChart = new Chart(ctx2, {
                    type: 'bar',
                    data: { labels: data.chartData.labels, datasets: data.chartData.pvData.map(ds => ({ label: ds.label, data: ds.data, backgroundColor: ds.color + 'cc', borderRadius: 4 })) },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1e293b', titleColor: '#f8fafc', bodyColor: '#94a3b8', borderWidth: 1, padding: 12, cornerRadius: 8 } }, scales: { x: { stacked: false, grid: { display: false }, ticks: { color: '#64748b' } }, y: { stacked: false, grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#64748b' } } } }
                });
            } else {
                secondChartTitle.textContent = '全院 新規数合計推移';
                secondChart = new Chart(ctx2, {
                    type: 'bar',
                    data: { labels: data.chartData.labels, datasets: [{ label: '全院合計', data: data.chartData.totalData, backgroundColor: 'rgba(34, 197, 94, 0.6)', borderColor: '#22c55e', borderWidth: 2, borderRadius: 8 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1e3b1e', titleColor: '#f8fafc', bodyColor: '#94a3b8', borderWidth: 1, padding: 12, cornerRadius: 8, callbacks: { label: ctx => `新規: ${ctx.raw}名` } } }, scales: { x: { grid: { display: false }, ticks: { color: '#64748b' } }, y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#64748b' }, beginAtZero: true } } }
                });
            }
        }

        function updateInsights() {
            let html = '';
            getCurrentData().insights.forEach(i => html += `<div class="insight-item"><h4>${i.title}</h4><p>${i.text}</p></div>`);
            document.getElementById('insightsGrid').innerHTML = html;
        }

        function switchBrand(brand) {
            currentBrand = brand;
            updateTheme();
            updateBrandBadge();
            updateSummary();
            updateStoreTabs();
            updateStoreGrid();
            updateTable();
            updateCharts();
            updateInsights();
        }

        document.addEventListener('DOMContentLoaded', () => {
            switchBrand('esthe');
            document.querySelectorAll('.brand-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    switchBrand(btn.dataset.brand);
                });
            });
        });
    </script>
